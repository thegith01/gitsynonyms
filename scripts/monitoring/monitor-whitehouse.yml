name: Monitor White House Videos

run-name: ${{ github.event_name == 'schedule' && 'White House channel scan' || format('White House video {0}', github.run_id) }}

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_check:
        description: Reprocess the latest upload even if it was already recorded
        required: false
        type: boolean
        default: false
      video_id:
        description: Process this specific video ID instead of resolving the channel
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: whitehouse-monitor
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      video_id: ${{ steps.ready.outputs.video_id }}
      video_title: ${{ steps.resolve.outputs.video_title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install "yt-dlp[default]"
          yt-dlp --version

      - name: Resolve the latest unprocessed channel upload
        id: resolve
        env:
          FORCE_CHECK: ${{ inputs.force_check }}
          FORCE_VIDEO_ID: ${{ inputs.video_id }}
        shell: pwsh
        run: ./scripts/monitoring/resolve_channel_feed.ps1

      - name: Skip uploads that were already published
        id: ready
        env:
          VIDEO_ID: ${{ steps.resolve.outputs.video_id }}
        run: |
          set -euo pipefail
          state_file=".github/state/whitehouse-processed-videos.txt"
          if [ -z "$VIDEO_ID" ]; then
            echo "no new upload"
            echo "video_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "$state_file" ] && grep -Fxq "$VIDEO_ID" "$state_file"; then
            echo "already processed: $VIDEO_ID"
            echo "video_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new upload: $VIDEO_ID"
          echo "video_id=$VIDEO_ID" >> "$GITHUB_OUTPUT"

  pipeline:
    needs: resolve
    if: needs.resolve.outputs.video_id != ''
    uses: ./.github/workflows/auto-pipeline.yml
    permissions:
      contents: write
    with:
      video_id: ${{ needs.resolve.outputs.video_id }}
      title: ${{ needs.resolve.outputs.video_title }}
    secrets: inherit

  mark-processed:
    needs: [resolve, pipeline]
    if: needs.resolve.outputs.video_id != '' && needs.pipeline.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record the successfully published video
        env:
          VIDEO_ID: ${{ needs.resolve.outputs.video_id }}
        run: |
          set -euo pipefail
          state_file=".github/state/whitehouse-processed-videos.txt"
          mkdir -p "$(dirname "$state_file")"
          touch "$state_file"
          if ! grep -Fxq "$VIDEO_ID" "$state_file"; then
            printf '%s\n' "$VIDEO_ID" >> "$state_file"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$state_file"
            git commit -m "Record published White House video $VIDEO_ID"
            git push origin main
          fi

  record-failure:
    # A video that keeps failing must not block every later upload: count the
    # attempt, and let resolve_channel_feed.ps1 skip it after three failures.
    needs: [resolve, pipeline]
    if: needs.resolve.outputs.video_id != '' && needs.pipeline.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Count the failed attempt
        env:
          VIDEO_ID: ${{ needs.resolve.outputs.video_id }}
        run: |
          set -euo pipefail
          state_file=".github/state/whitehouse-failed-videos.txt"
          mkdir -p "$(dirname "$state_file")"
          touch "$state_file"
          tmp="$(mktemp)"
          awk -v id="$VIDEO_ID" '
            /^[[:space:]]*#/ { print; next }
            NF == 0 { next }
            $1 == id { print $1, $2 + 1; found = 1; next }
            { print }
            END { if (!found) print id, 1 }
          ' "$state_file" > "$tmp"
          mv "$tmp" "$state_file"
          if git diff --quiet -- "$state_file"; then
            echo "failure count unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$state_file"
          git commit -m "Record failed White House video $VIDEO_ID"
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            git pull --rebase --autostash origin main
          done
          echo "::error::could not push the failure counter"
          exit 1
