name: Auto pipeline - detect to publish

# End-to-end chain for one monitored upload (DIRECTIVE 3.6 / 3.7):
#   verify the event on the web -> rank candidate sources -> download the best
#   (direct, then the full proxy pool) -> take the seven YouTube caption
#   formats -> ASR fallback -> machine-translation fallback -> word-timed ASS
#   -> burn 1080p -> Release + Pages + filebin backup.
#
# Called by monitor-whitehouse.yml, or run manually for one video id.

on:
  workflow_call:
    inputs:
      video_id:
        required: true
        type: string
      source_video_id:
        description: Force this video id as the source and skip candidate ranking
        required: false
        type: string
        default: ""
      source_url:
        description: Reuse an already backed-up source file instead of downloading again
        required: false
        type: string
        default: ""
      mode:
        required: false
        type: string
        default: "full"
      title:
        required: false
        type: string
        default: ""
      event_date:
        required: false
        type: string
        default: ""
      crf:
        required: false
        type: string
        default: "30"
      min_height:
        description: Minimum source height; lower only with a declared degradation
        required: false
        type: string
        default: "1080"
      preset:
        required: false
        type: string
        default: "veryfast"
      publish:
        description: Publish to the GitHub Release and Pages after the filebin backup
        required: false
        type: boolean
        default: true
      asr_model:
        required: false
        type: string
        default: "base"
      force_asr:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      video_id:
        required: true
        default: "9aPyO1jfDGM"
      source_video_id:
        description: "Force this video id as the source (empty = rank candidates)"
        required: false
        default: ""
      source_url:
        description: "Reuse an already backed-up source file instead of downloading again"
        required: false
        default: ""
      mode:
        description: "probe = verify, rank and caption discovery only"
        required: false
        default: "full"
        type: choice
        options: ["full", "probe", "test"]
      title:
        required: false
        default: "LIVE: President Trump rallies in Michigan ahead of state's November Election"
      event_date:
        required: false
        default: "2026-10-25"
      crf:
        required: false
        default: "30"
      min_height:
        description: "Minimum source height; lower only with a declared degradation"
        required: false
        default: "1080"
      preset:
        required: false
        default: "veryfast"
      publish:
        description: "Publish to the GitHub Release and Pages after the filebin backup"
        required: false
        type: boolean
        default: true
      asr_model:
        required: false
        default: "base"
      force_asr:
        description: "Skip YouTube captions and force the ASR path"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Different videos may run in parallel; only a duplicate dispatch of the
  # same video waits.  The filebin backup uses per-video filenames, so the
  # jobs do not collide.
  group: auto-pipeline-${{ inputs.video_id || 'default' }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FILEBIN_BIN: "f8l40pcd28jo8bl0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the JavaScript runtime yt-dlp needs
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Free disk space for the media toolchain
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install media, caption and translation tools
        run: |
          set -x
          sudo DEBIAN_FRONTEND=noninteractive timeout 300 apt-get update -qq || true
          sudo DEBIAN_FRONTEND=noninteractive timeout 420 apt-get install -y -qq \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 ffmpeg fonts-wqy-zenhei || true
          python -m pip install --upgrade pip
          # argostranslate pulls stanza, which pulls torch.  The default wheel
          # drags several gigabytes of CUDA libraries onto a runner that only
          # has a CPU, and that is what filled the disk.  Install the CPU wheel
          # first so the later resolve keeps it.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          # faster-whisper 1.2.1 declares only `av>=11` but passes
          # `metadata_errors=` to av.open(), which older av releases reject
          # (TypeError: open() got an unexpected keyword argument).  Pin a
          # release that actually has the keyword so the ASR fallback runs.
          python -m pip install "yt-dlp[default]" argostranslate faster-whisper "av>=14"
          deno --version
          ffmpeg -version | head -1
          df -h /

      - name: Verify the event on the web
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          TITLE: ${{ inputs.title }}
          EVENT_DATE: ${{ inputs.event_date }}
        run: |
          python scripts/verify_event.py \
            --video-id "$VIDEO_ID" --title "$TITLE" --event-date "$EVENT_DATE" \
            --report work/EVENT.json || true
          cat work/EVENT.json 2>/dev/null || true

      - name: Rank candidate sources
        id: sources
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          TITLE: ${{ inputs.title }}
          PROXY: ${{ secrets.YTDLP_PROXY }}
          FORCE_SOURCE: ${{ inputs.source_video_id }}
        run: |
          set +e
          if [ -n "${FORCE_SOURCE:-}" ]; then
            echo "forced source: $FORCE_SOURCE"
            echo "chosen=$FORCE_SOURCE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/rank_video_sources.py \
            --title "$TITLE" --video-id "$VIDEO_ID" --proxy "$PROXY" \
            --report work/SOURCES.json
          status=$?
          chosen="$VIDEO_ID"
          if [ -f work/SOURCES.json ]; then
            candidate="$(python -c "import json;d=json.load(open('work/SOURCES.json'));print(d.get('selected') or '')")"
            if [ -n "$candidate" ] && [ "$status" -eq 0 ]; then
              chosen="$candidate"
            fi
          fi
          echo "chosen=$chosen" >> "$GITHUB_OUTPUT"
          echo "chosen source: $chosen"

      - name: Restore the tiered proxy pool
        uses: actions/cache/restore@v4
        with:
          path: proxyindex/pool
          key: proxy-tier3-${{ github.run_id }}
          restore-keys: proxy-tier3-

      - name: Download the selected source (direct, then the proxy pool)
        id: source
        if: inputs.mode != 'probe'
        env:
          VIDEO_ID: ${{ steps.sources.outputs.chosen }}
          MIN_HEIGHT: ${{ inputs.min_height }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          mkdir -p work
          if [ -n "${SOURCE_URL:-}" ]; then
            echo "reusing the backed-up source: $SOURCE_URL"
            curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
              -o "work/${VIDEO_ID}.source.mp4" "$SOURCE_URL"
            python -c "import json,pathlib,sys; pathlib.Path('work/download-report.json').write_text(json.dumps({'video_id': sys.argv[1], 'source': 'filebin', 'attempts': [{'ok': True, 'proxy': '', 'method': 'filebin'}]}, indent=2) + '\n', encoding='utf-8')" "$VIDEO_ID"
            height="$(ffprobe -v error -select_streams v:0 \
              -show_entries stream=height -of csv=p=0 "work/${VIDEO_ID}.source.mp4")"
            echo "source height: ${height}p (minimum ${MIN_HEIGHT}p)"
            if [ -n "$height" ] && [ "$height" -lt "$MIN_HEIGHT" ]; then
              echo "::error::backed-up source is ${height}p, below the required ${MIN_HEIGHT}p"
              exit 1
            fi
          else
            python scripts/download_source_video.py \
              --video-id "$VIDEO_ID" --output-dir work --min-height "$MIN_HEIGHT" \
              --proxy-limit 0 --proxy-tries 30 --timeout 1200 \
              --report work/download-report.json
          fi
          file="$(find work -maxdepth 1 -type f -name "${VIDEO_ID}.source.*" \
            ! -name "*.part" ! -name "*.ytdl" | head -1)"
          if [ -z "$file" ]; then
            echo "::error::downloaded source file not found"
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          ls -lh "$file"

      - name: Validate a working proxy for caption requests
        if: inputs.mode != 'probe'
        continue-on-error: true
        env:
          VIDEO_ID: ${{ steps.sources.outputs.chosen }}
        run: |
          python scripts/select_working_proxy.py \
            --video-id "$VIDEO_ID" --report work/download-report.json \
            --candidates 60 --verify 8 || true

      - name: Back up the downloaded source to the bin
        if: inputs.mode != 'probe' && inputs.source_url == ''
        continue-on-error: true
        env:
          VIDEO_ID: ${{ steps.sources.outputs.chosen }}
          SOURCE: ${{ steps.source.outputs.file }}
        run: |
          set -euo pipefail
          name="$(basename "$SOURCE")"
          echo "backing up $name"
          curl -f --retry 3 --retry-delay 5 -X POST --data-binary "@$SOURCE" \
            "https://filebin.net/${FILEBIN_BIN}/${name}"

      - name: Score the footage on the five material criteria
        id: footage
        if: inputs.mode != 'probe'
        continue-on-error: true
        env:
          VIDEO_ID: ${{ steps.sources.outputs.chosen }}
          SOURCE: ${{ steps.source.outputs.file }}
        run: |
          mkdir -p work
          python scripts/footage_quality.py \
            --video "$SOURCE" --sources work/SOURCES.json \
            --report work/FOOTAGE.json \
            --samples 6 --sample-seconds 20
          echo "footage score recorded in work/FOOTAGE.json"

      - name: Take the seven YouTube caption formats
        id: captions
        if: ${{ !inputs.force_asr }}
        env:
          VIDEO_ID: ${{ steps.sources.outputs.chosen }}
        run: |
          set +e
          caps="output/auto_${VIDEO_ID}"
          mkdir -p "$caps"
          echo "dir=$caps" >> "$GITHUB_OUTPUT"
          python scripts/fetch_youtube_captions.py \
            --video-id "$VIDEO_ID" --output-dir "$caps" \
            --groups "en,zh" --wait 2 --report "$caps/CAPTION_FORMATS.json"
          echo "caption probe exit: $?"
          if ! find "$caps" -type f -name "${VIDEO_ID}*.en-orig.json3" | grep -q . || \
             ! find "$caps" -type f -name "${VIDEO_ID}*.zh-Hans.*" | grep -q .; then
            archived="$(find output -type f -name "${VIDEO_ID}*.en-orig.json3" \
              -not -path "$caps/*" -print -quit)"
            if [ -n "$archived" ]; then
              archive_dir="$(dirname "$archived")"
              if find "$archive_dir" -type f -name "${VIDEO_ID}*.zh-Hans.*" | grep -q .; then
                echo "caption fetch incomplete; using archived $archive_dir"
                echo "dir=$archive_dir" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi
          if [ -f "$caps/CAPTION_FORMATS.json" ]; then
            python - "$caps/CAPTION_FORMATS.json" <<'PY' || true
          import json, sys
          data = json.load(open(sys.argv[1]))
          for code, track in data.get("tracks", {}).items():
              print(code, "present" if track.get("present") else "missing",
                    ",".join(track.get("formats") or []))
          PY
          fi
          ls -1 "$caps" | sed -n '1,40p'

      - name: ASR fallback when the English track is missing
        if: inputs.mode != 'probe'
        env:
          ASSEMBLYAI: ${{ secrets.ASSEMBLYAI }}
          VIDEO_ID: ${{ steps.sources.outputs.chosen }}
          CAPS: ${{ steps.captions.outputs.dir }}
          MODEL: ${{ inputs.asr_model }}
          SOURCE: ${{ steps.source.outputs.file }}
          FORCE_ASR: ${{ inputs.force_asr }}
        run: |
          set -euo pipefail
          if [ -z "$CAPS" ] || [ ! -d "$CAPS" ]; then
            CAPS="output/auto_${VIDEO_ID}"
            mkdir -p "$CAPS"
          fi
          if find "$CAPS" -name "${VIDEO_ID}*.en-orig.*" | grep -q .; then
            echo "YouTube English captions present; skipping ASR"
            echo "CAPS=$CAPS" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "${FORCE_ASR:-false}" = "true" ]; then
            echo "force_asr requested; skipping the YouTube probe and using ASR"
          else
            # A failed caption probe is not proof that YouTube has no English
            # track.  Only a report that says the track is absent (no download
            # error) may fall back to ASR; a missing report or a failed
            # download is transient and must fail fast so the monitor retries
            # instead of burning an hour on local transcription.
            if [ ! -f "$CAPS/CAPTION_FORMATS.json" ]; then
              echo "::error::caption probe produced no report at $CAPS/CAPTION_FORMATS.json (YouTube or proxy failure); refusing to guess with ASR"
              exit 1
            fi
            verdict="$(python - "$CAPS/CAPTION_FORMATS.json" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          track = (data.get("tracks") or {}).get("en-orig") or {}
          if track.get("present"):
              print("present")
          elif track.get("error"):
              print("probe-error")
          else:
              print("absent")
          PY
          )"
            case "$verdict" in
              present)
                echo "::error::the caption report says English is present but no en-orig file was written; caption download failed"
                exit 1
                ;;
              probe-error)
                echo "::error::the English caption download failed (see $CAPS/CAPTION_FORMATS.json); treating it as transient"
                exit 1
                ;;
              absent)
                echo "YouTube publishes no English track; falling back to ASR"
                ;;
              *)
                echo "::error::unexpected caption report verdict: $verdict"
                exit 1
                ;;
            esac
          fi
          if [ -n "${ASSEMBLYAI:-}" ]; then
            echo "transcribing with AssemblyAI"
            python scripts/assemblyai_captions.py \
              --video "$SOURCE" --video-id "$VIDEO_ID" \
              --track en-orig --output-dir "$CAPS" --work-dir work
          else
            echo "no ASSEMBLYAI secret; using local faster-whisper"
            python scripts/asr_captions.py \
              --video "$SOURCE" --video-id "$VIDEO_ID" \
              --track en-orig --model "$MODEL" --output-dir "$CAPS"
          fi
          echo "CAPS=$CAPS" >> "$GITHUB_ENV"

      - name: Machine-translation fallback for the Chinese track
        if: inputs.mode != 'probe'
        env:
          ASSEMBLYAI: ${{ secrets.ASSEMBLYAI }}
          VIDEO_ID: ${{ steps.sources.outputs.chosen }}
        run: |
          set -euo pipefail
          caps="${CAPS:-${{ steps.captions.outputs.dir }}}"
          if find "$caps" -name "${VIDEO_ID}*.zh-Hans.*" | grep -q .; then
            echo "YouTube Chinese captions present; skipping translation"
          else
            engine=argos
            if [ -n "${ASSEMBLYAI:-}" ]; then engine=assemblyai; fi
            echo "translating the English track with $engine"
            python scripts/machine_translate_captions.py \
              --caption-dir "$caps" --video-id "$VIDEO_ID" \
              --source-language en-orig --target-language zh-Hans \
              --engine "$engine" --output-dir "$caps" --report "$caps/SUBTITLE_SOURCES.json"
          fi

      - name: Burn word-timed bilingual 1080p
        if: inputs.mode != 'probe'
        env:
          VIDEO_ID: ${{ steps.sources.outputs.chosen }}
          CRF: ${{ inputs.crf }}
          PRESET: ${{ inputs.preset }}
          TITLE: ${{ inputs.title }}
          EVENT_DATE: ${{ inputs.event_date }}
          SOURCE: ${{ steps.source.outputs.file }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          caps="${CAPS:-${{ steps.captions.outputs.dir }}}"
          python scripts/video_processing.py \
            --video "$SOURCE" \
            --caption-dir "$caps" --languages "zh-Hans,en-orig" \
            --video-id "$VIDEO_ID" --title "$TITLE" --event-date "$EVENT_DATE" \
            --output-dir output --encoder libx264 --crf "$CRF" --preset "$PRESET" \
            --caption-box auto --force
          size=$(stat -c%s "output/Burned_Bilingual_${VIDEO_ID}.mp4")
          echo "final bytes: $size"
          if [ "$size" -gt 2000000000 ] && [ "${PUBLISH:-true}" = "true" ] ; then
            echo "::error::final MP4 exceeds the 2 GB release asset limit"
            exit 1
          fi
          if [ "$size" -gt 2000000000 ]; then
            echo "::warning::final MP4 exceeds 2 GB; it is backed up to the bin but cannot be a Release asset"
          fi

      - name: Cut the web preview and poster
        if: inputs.mode == 'full' && inputs.publish
        env:
          VIDEO_ID: ${{ steps.sources.outputs.chosen }}
        run: |
          set -euo pipefail
          python scripts/make_web_preview.py \
            --video "output/Burned_Bilingual_${VIDEO_ID}.mp4" \
            --video-id "$VIDEO_ID" \
            --output-dir site/media

      - name: Back up subtitles and deliverables to the bin
        if: inputs.mode == 'full'
        env:
          VIDEO_ID: ${{ steps.sources.outputs.chosen }}
        run: |
          set -euo pipefail
          caps="${CAPS:-${{ steps.captions.outputs.dir }}}"
          mkdir -p dist
          cp "$caps"/"${VIDEO_ID}".* dist/ 2>/dev/null || true
          cp "$caps"/SUBTITLE_SOURCES.json dist/ 2>/dev/null || true
          cp output/BURN.json "dist/${VIDEO_ID}.BURN.json" 2>/dev/null || true
          cp output/TIMING.json "dist/${VIDEO_ID}.TIMING.json" 2>/dev/null || true
          cp work/EVENT.json "dist/${VIDEO_ID}.EVENT.json" 2>/dev/null || true
          cp work/SOURCES.json "dist/${VIDEO_ID}.SOURCES.json" 2>/dev/null || true
          cp work/FOOTAGE.json "dist/${VIDEO_ID}.FOOTAGE.json" 2>/dev/null || true
          (cd dist && zip -q -r "bilingual_bundle_${VIDEO_ID}.zip" .)
          cp "output/Burned_Bilingual_${VIDEO_ID}.mp4" dist/
          for file in dist/*; do
            curl -f --retry 3 --retry-delay 5 -X POST --data-binary "@$file" \
              "https://filebin.net/${FILEBIN_BIN:-f8l40pcd28jo8bl0}/$(basename "$file")"
          done

      - name: Publish MP4 to the release
        if: inputs.mode == 'full' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO_ID: ${{ steps.sources.outputs.chosen }}
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          mp4="output/Burned_Bilingual_${VIDEO_ID}.mp4"
          if gh release view "$VIDEO_ID" >/dev/null 2>&1; then
            gh release upload "$VIDEO_ID" "$mp4" --clobber
          else
            gh release create "$VIDEO_ID" "$mp4" \
              --title "${TITLE:-Bilingual video $VIDEO_ID}" \
              --notes "Chinese and English captions burned into the source."
          fi

      - name: Generate Pages site
        if: inputs.mode == 'full' && inputs.publish
        run: python scripts/generate_video_pages.py

      - name: Commit archive and site
        if: inputs.mode == 'full' && inputs.publish
        env:
          VIDEO_ID: ${{ steps.sources.outputs.chosen }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git add output/ site/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Publish bilingual video $VIDEO_ID"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi